# workflow_run in merge-posts.yml matches this name. Renaming it stops automatic merges.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Format Check
        id: format
        run: pnpm fmt:check

      - name: Test
        id: test
        run: pnpm test

      - name: Build
        id: build
        run: pnpm build

      - name: Write job summary
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅ Success" ;;
              failure) echo "❌ Failure" ;;
              cancelled) echo "⚪ Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "⏭️ Skipped" ;;
            esac
          }

          {
            echo "## CI Summary"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Oxlint | $(status_icon "${LINT_RESULT:-}") |"
            echo "| Oxfmt | $(status_icon "${FORMAT_RESULT:-}") |"
            echo "| Tests | $(status_icon "${TEST_RESULT:-}") |"
            echo "| Astro build | $(status_icon "${BUILD_RESULT:-}") |"
          } >> "$GITHUB_STEP_SUMMARY"
