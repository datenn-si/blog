name: Update posts

on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA of the posts commit to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "sha must be a 40-character hex commit id"
            exit 1
          fi
          printf 'SHA=%s\n' "${SHA,,}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Point posts at the requested commit
        id: update
        run: |
          git -C posts fetch --depth=1 origin "$SHA" || git -C posts fetch origin "$SHA"
          git -C posts checkout --detach "$SHA"
          actual=$(git -C posts rev-parse HEAD)
          if [ "$actual" != "$SHA" ]; then
            echo "posts HEAD is ${actual}"
            exit 1
          fi
          if git diff --quiet -- posts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already records ${SHA}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # shortcut: a second post: push before this PR merges conflicts on the gitlink. Merge the older PR first.
      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.POSTS_UPDATE_TOKEN }}
          GH_TOKEN: ${{ secrets.POSTS_UPDATE_TOKEN }}
        run: |
          short="${SHA:0:12}"
          branch="posts/update-${short}"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch "$remote" "+refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            recorded=$(git rev-parse "refs/remotes/origin/${branch}:posts")
            expected=$(git rev-parse "refs/remotes/origin/${branch}")
          else
            recorded=""
            expected=""
          fi

          if [ "$recorded" != "$SHA" ]; then
            export GIT_AUTHOR_NAME="github-actions[bot]"
            export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            git add posts
            git commit -m "chore: update posts to ${short}"
            if [ -n "$expected" ]; then
              git push --force-with-lease="refs/heads/${branch}:${expected}" "$remote" "HEAD:refs/heads/${branch}"
            else
              git push "$remote" "HEAD:refs/heads/${branch}"
            fi
          fi

          line=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base main \
            --state all \
            --json number,state \
            --jq 'if length == 0 then ["", ""] else [.[0].number, .[0].state] end | @tsv')
          number=${line%%$'\t'*}
          state=${line#*$'\t'}
          case "$state" in
            OPEN)
              echo "Pull request #${number} is open"
              ;;
            CLOSED)
              gh pr reopen "$number" --repo "$GITHUB_REPOSITORY"
              ;;
            MERGED)
              echo "Pull request #${number} is already merged"
              ;;
            *)
              created=false
              for _ in 1 2 3 4 5; do
                if gh pr create \
                  --repo "$GITHUB_REPOSITORY" \
                  --base main \
                  --head "$branch" \
                  --title "chore: update posts to ${short}" \
                  --body "$(printf 'Update the posts submodule to `%s`.\n\nCI merges this pull request after the checks succeed.\n' "$SHA")"; then
                  created=true
                  break
                fi
                sleep 5
              done
              if [ "$created" != true ]; then
                exit 1
              fi
              ;;
          esac
